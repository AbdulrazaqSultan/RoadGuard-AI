name: roadguard_mobile
description: Arabic-first operations dashboard for finalized RoadGuardAI events.
publish_to: none
version: 0.8.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.10.0
  camera: ^0.12.2
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  http: ^1.6.0
  geolocator: ^14.0.0
  image_picker: ^1.2.1
  intl: any
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  firebase_auth: 6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
